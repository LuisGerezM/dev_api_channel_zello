# Publica el sitio estático en GitHub Pages en cada push a main.
# Solo se sube lo necesario para la página (no README, ni configs, ni el workflow).
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r index.html favicon.svg css js _site/
          # Control: que no se cuele ninguna credencial
          if [ -e _site/config.local.js ]; then echo "config.local.js no debe publicarse" >&2; exit 1; fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
